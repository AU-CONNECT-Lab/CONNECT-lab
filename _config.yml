title: CONNECT Lab
# This description is NOT shown on any page — it is the text Google prints
# under the link in search results, and the blurb shown when someone pastes
# the site into Slack, iMessage or Instagram. Individual pages can override
# it with a `description:` line in their front matter.
description: >-
  CONNECT Lab at Auburn University, directed by Dr. Tianying Cai, studies how
  adolescents' social worlds shape the developing brain and body using fNIRS
  hyperscanning, physiological measures, and neuroimaging.

# The real, live address of this site. Jekyll uses it to build the canonical
# link and the share-preview tags, so a wrong value here tells Google the page
# really lives somewhere else. Do not leave a placeholder in these two lines.
url: "https://au-connect-lab.github.io"
baseurl: "/CONNECT-lab"     # must match the GitHub repo name exactly, including capitals

# Preview picture used when the site is shared on social media or in chat apps.
image: /assets/images/lab-photo-formal.jpg

# Lab info (edit these)
lab:
  pi_name: Dr. Tianying Cai
  pi_email: tic0006@auburn.edu
  lab_email: chct@auburn.edu
  pi_title: Assistant Professor of Human Development and Family Science
  university: Auburn University
  room: 215 M. W. Smith Hall
  department: Department of Human Development and Family Science
  college: College of Human Sciences
  google_scholar: "https://scholar.google.com/citations?user=UiL-bLoAAAAJ"
  twitter: ""          # optional
  instagram: "https://www.instagram.com/au_connect_lab/"
  github: "https://github.com/AU-CONNECT-Lab"
  lab_phone: ""        # optional
  # Other places the same person appears online. These are not displayed on
  # the site; they are listed in the hidden identity card (see
  # _includes/structured-data.html) that tells search engines the Tianying Cai
  # on this site, on Google Scholar, on LinkedIn and in the Auburn directory
  # are all one person. Add an ORCID here when you have one.
  linkedin: "https://www.linkedin.com/in/tianying-cai-45ab64127"
  auburn_profile: "https://humsci.auburn.edu/directory/profile.php?id=tic0006"
  orcid: ""

# Visitor analytics — GoatCounter (https://www.goatcounter.com)
# Privacy-friendly: no cookies, no personal data, nothing visitors must consent to.
# Put the site code you pick when signing up in the quotes below.
# Leave it empty ("") to switch visitor counting off everywhere.
analytics:
  goatcounter: "au-connect-lab"

# Jekyll settings
theme: null
markdown: kramdown
highlighter: rouge
permalink: pretty

# Collections — each folder below is a "collection"
# Jekyll reads every .md file in the folder and makes it available as data
collections:
  members:
    output: false       # we render members on the team page, not as individual URLs
  publications:
    output: false
  projects:
    output: false
  updates:
    output: true        # each update gets its own page (optional)
    permalink: /updates/:name/
  resources:
    output: true
    permalink: /resources/:name/

# Default front matter
defaults:
  - scope:
      path: ""
      type: members
    values:
      layout: null
  - scope:
      path: ""
      type: publications
    values:
      layout: null
  # Individual Lab Update pages use _layouts/update.html.
  # Without this they render as bare HTML with no navigation.
  - scope:
      path: ""
      type: updates
    values:
      layout: update

plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap     # builds /sitemap.xml so search engines can find every page
